<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The explorer's mark: four choropleth cells on the map's night blue.
       The same image is the scene explorer's favicon (apps/explorer). -->
  <rect width="16" height="16" rx="2" fill="#0b1020"/>
  <rect x="2" y="2" width="5" height="5" fill="#1a9850"/>
  <rect x="9" y="2" width="5" height="5" fill="#fee08b"/>
  <rect x="2" y="9" width="5" height="5" fill="#d73027"/>
  <rect x="9" y="9" width="5" height="5" fill="#6ea8ff"/>
</svg>
