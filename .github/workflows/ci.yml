name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # rashid takes a floor, not a pin. A pin goes stale the day the template
      # is created and every repo made from it inherits the stale version. A
      # floor takes each new 0.1.x release and still refuses a rashid that does
      # not carry the rules tests/test_conformance.py asserts. The gate checks
      # the same range at run time, so a local rashid cannot be older.
      #
      # stac-check stays unpinned on purpose. The stac-check exemption in
      # docs/conformance.md expires when the upstream crash stops. That only
      # happens if CI takes each new release.
      - name: Install the validators
        run: python -m pip install 'rashid>=0.1.5,<0.2.0' stac-check

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      # tests/run_all.py runs each test file as a script; it never runs them
      # under pytest, so a test with actual pytest-style assertions or
      # fixtures would silently never execute. This is the same tests/ suite,
      # collected and run the other way, as a second gate over it.
      #
      # tests/test_stats.py builds a real PMTiles archive with gpio pmtiles
      # create to check the tileset's layer name, so tippecanoe has to be on
      # PATH here too (same install as firms-catalog's refresh workflow).
      # geoparquet-io does not pull in the pmtiles package on its own (it is
      # only a dependency of portolan-cli), so it is installed alongside it
      # to read the built archive's metadata.
      - name: Unit test suite (pytest)
        env:
          CI_LIGHT: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          python -m pip install --quiet duckdb geoparquet-io pmtiles pytest pytz
          python3 -m pytest tests/ -q
