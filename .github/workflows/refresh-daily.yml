name: refresh-daily

# Pull the last few days of Earth Search items into the current year's
# live.parquet, splice the current year into the stats table, restamp
# extents/counts, upload. Nothing is committed: the repository keeps only
# the stable catalog definition (firms-catalog model).
#
# The 5-day lookback covers Sentinel-2's hours-to-days publication latency;
# the dedupe rule in s2_build makes re-fetched days harmless within live,
# and --exclude-ids-from keeps live disjoint from the year's archive parts:
# after a consolidation the lookback re-fetches days the octants already
# hold, and without the exclusion those scenes were published twice for up
# to five days (49,942 of live's 84,675 rows on 2026-09-19), which broke the
# "a glob reads each scene once" promise and inflated the month's stats.
#
# Bootstrap guard: on a fresh repo nothing is published yet (the backfill
# and publish-backfill pipeline runs once, separately, to seed the catalog).
# The first step here probes for catalog.json and every other step is
# gated on that succeeding, so the scheduled cron is a green no-op --
# not a daily red X -- until the first publish lands.

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to refresh"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"
      # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' \
            'rashid>=0.1.8,<0.2.0' stac-check
      - name: Fetch the lookback window
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          START=$(date -u -d "5 days ago" +%F)
          END=$(date -u +%F)
          python3 tools/s2_fetch.py --start "$START" --end "$END" \
            --out ./staging/chunks
      # The current year's published archive parts, probed once and used
      # twice: the live build excludes their ids, and the stats splice
      # reads them alongside live. The archive is items.parquet for a year
      # published whole (2015-2018), the four z*.parquet UTM-zone quartiles
      # for 2019-2020, or the eight octants from 2021 (spec Amendment 3);
      # the names come from tools/s2_build.py archive_part_names() so this
      # cannot drift from the builder. Every name is probed: 404 means that
      # shape is not this year's, any other non-200 is a part this run
      # cannot see and fails the job. An empty list (a year with no
      # consolidation yet) is allowed here; the stats step decides what it
      # means for the splice.
      - name: Enumerate the current year's archive parts
        id: archive
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          Y=$(date -u +%Y)
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog
          ARCHIVE_NAMES=$(python3 -c '
          import sys; sys.path.insert(0, "tools")
          from s2_build import archive_part_names
          print(" ".join(archive_part_names()))')
          URLS=()
          for NAME in $ARCHIVE_NAMES; do
            URL="$BASE/sentinel-2-l2a/year=$Y/$NAME.parquet"
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I "$URL")
            case "$CODE" in
              200) URLS+=("$URL") ;;
              404) ;;
              *) echo "::error::$URL: HEAD answered $CODE, not 200 or 404"; exit 1 ;;
            esac
          done
          echo "archive part(s) for $Y: ${#URLS[@]}"
          echo "urls<<PARTS_EOF" >> "$GITHUB_OUTPUT"
          if [ "${#URLS[@]}" -gt 0 ]; then
            printf '  %s\n' "${URLS[@]}"
            printf '%s\n' "${URLS[@]}" >> "$GITHUB_OUTPUT"
          fi
          echo "PARTS_EOF" >> "$GITHUB_OUTPUT"
      - name: Rebuild the live part
        if: steps.guard.outputs.published == 'true'
        env:
          ARCHIVE_URLS: ${{ steps.archive.outputs.urls }}
        run: |
          set -euo pipefail
          Y=$(date -u +%Y)
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
          # Merge with the existing live part so a fetch gap never truncates
          # it. The dedupe rule resolves duplicates within live; the year's
          # archive parts are the floor: every id they hold is dropped from
          # live before the sort (--exclude-ids-from), so live and archive
          # never overlap and a glob over the year reads each scene once.
          #
          # HEAD first, and only a 404 means "no previous live". A 200 makes
          # the GET mandatory, and any failure -- a 5xx, a timeout, a body
          # cut short -- stops the run; so does any HEAD answer that is not
          # 200 or 404. The old `curl ... || rm -f` treated every failure
          # as "no previous live": live was then rebuilt from the five-day
          # slice alone, uploaded without complaint (its size differs), and
          # the next consolidation folded it -- every scene between the last
          # consolidation and today-5d gone from the archive for good, with
          # no signal. Same pattern as consolidate-month.yml's fetch().
          SRC="./staging/chunks"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I "$BASE/year=$Y/live.parquet")
          case "$CODE" in
            200)
              curl -fSL -o staging/live-prev.parquet "$BASE/year=$Y/live.parquet" || {
                rm -f staging/live-prev.parquet
                echo "::error::year=$Y/live.parquet: GET failed after HEAD 200; a live rebuilt without it would lose every scene since the last consolidation"
                exit 1
              }
              SRC="$SRC staging/live-prev.parquet"
              ;;
            404)
              echo "year=$Y/live.parquet: not published (404); building the year's first live from the slice alone"
              ;;
            *)
              echo "::error::year=$Y/live.parquet: HEAD answered $CODE, not 200 or 404"
              exit 1
              ;;
          esac
          EXCLUDE=()
          if [ -n "$ARCHIVE_URLS" ]; then
            mapfile -t URLS <<< "$ARCHIVE_URLS"
            EXCLUDE=(--exclude-ids-from "${URLS[@]}")
          fi
          python3 tools/s2_build.py --sources $SRC --years "$Y" \
            --out ./staging/publish/sentinel-2-l2a --name live.parquet \
            "${EXCLUDE[@]}"
      # The current year's sources are its published archive parts (the
      # list enumerated above) plus the live.parquet just built. A current
      # year with no archive part at all is a broken catalog, not a smaller
      # splice -- it fails.
      - name: Splice current year into stats
        if: steps.guard.outputs.published == 'true'
        env:
          ARCHIVE_URLS: ${{ steps.archive.outputs.urls }}
        run: |
          set -euo pipefail
          Y=$(date -u +%Y)
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog
          if [ -z "$ARCHIVE_URLS" ]; then
            echo "::error::no archive part published under year=$Y; refusing to splice stats from live alone"
            exit 1
          fi
          mapfile -t SRC <<< "$ARCHIVE_URLS"
          echo "archive part(s) for $Y:"; printf '  %s\n' "${SRC[@]}"
          python3 tools/s2_stats.py \
            --sources "${SRC[@]}" \
                      "./staging/publish/sentinel-2-l2a/year=$Y/live.parquet" \
            --out ./staging/publish/stats \
            --merge-years "$Y" --existing "$BASE/stats/mgrs-monthly.parquet"
      # Both collections: the item index from its published parts plus the
      # live part just built, and the stats collection's extent, row count
      # and `updated` from the timeline the splice just wrote.
      - name: Restamp collection metadata
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          python3 tools/make_items.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_stats_collection.py --data-dir ./staging/publish/stats --remote-baseline
      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"
      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2
      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm
