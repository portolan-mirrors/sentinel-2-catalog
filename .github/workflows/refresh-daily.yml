name: refresh-daily

# Pull the last few days of Earth Search items into live.parquet, splice
# the years they touch into the stats table, restamp extents/counts,
# upload. Nothing is committed: the repository keeps only the stable
# catalog definition (firms-catalog model).
#
# The 5-day lookback covers Sentinel-2's hours-to-days publication latency;
# the dedupe rule in s2_build makes re-fetched days harmless within live,
# and --exclude-ids-from keeps live disjoint from the year's archive parts:
# after a consolidation the lookback re-fetches days the octants already
# hold, and without the exclusion those scenes were published twice for up
# to five days (49,942 of live's 84,675 rows on 2026-09-19), which broke the
# "a glob reads each scene once" promise and inflated the month's stats.
#
# Years come from the slice, not the calendar. From December 27th to
# January 2nd the lookback spans two years, and each year in it gets its
# own live.parquet (previous live + slice, minus that year's archive ids)
# and its own place in the stats splice. The old rule, `--years $(date
# +%Y)`, dropped the late-December scenes of the first January runs and,
# with the splice refusing a year that had no archive part, failed every
# run of the new year before anything was uploaded -- so the new year's
# live never existed and consolidate-month never had anything to fold.
# The splice now reads a year from live alone when it has no archive
# part yet, but only for the current calendar year: that is the new
# year's first days, before its first consolidation. Any other year
# with no archive part is a broken catalog and still fails.
#
# Bootstrap guard: on a fresh repo nothing is published yet (the backfill
# and publish-backfill pipeline runs once, separately, to seed the catalog).
# The first step here probes for catalog.json and every other step is
# gated on that succeeding, so the scheduled cron is a green no-op --
# not a daily red X -- until the first publish lands.

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to refresh"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"
      # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' \
            'rashid>=0.1.8,<0.2.0' stac-check
      - name: Fetch the lookback window
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          START=$(date -u -d "5 days ago" +%F)
          END=$(date -u +%F)
          python3 tools/s2_fetch.py --start "$START" --end "$END" \
            --out ./staging/chunks
      # One round of probes for every year in the slice, through
      # s2_build.published_part (retried; a code that is not 200 or 404
      # stops the run): is that year's live.parquet published, and which
      # of its archive parts are. The archive is items.parquet for a year
      # published whole (2015-2018), the four z*.parquet UTM-zone
      # quartiles for 2019-2020, or the eight octants from 2021 (spec
      # Amendment 3); the names come from tools/s2_build.py
      # archive_part_names() so this cannot drift from the builder. An
      # empty part list (a year with no consolidation yet) is allowed
      # here; the stats step decides what it means for the splice. The
      # answers land under staging/plan/ as plain files for the bash
      # steps below.
      - name: Plan every year in the slice
        if: steps.guard.outputs.published == 'true'
        env:
          BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, sys
          from pathlib import Path
          import duckdb
          sys.path.insert(0, "tools")
          from s2_build import archive_part_names, gather, published_part
          base = os.environ["BASE"]
          files = gather(["staging/chunks"])
          lst = ",".join(f"'{f}'" for f in files)
          con = duckdb.connect()
          con.execute("SET TimeZone='UTC';")   # the build's year() zone
          years = [r[0] for r in con.execute(
              f"SELECT DISTINCT year(datetime) AS y "
              f"FROM read_parquet([{lst}], union_by_name=true) ORDER BY y"
          ).fetchall()]
          if not years:
              raise SystemExit("the lookback slice holds no rows")
          plan = Path("staging/plan")
          plan.mkdir(parents=True)
          (plan / "years").write_text("".join(f"{y}\n" for y in years))
          for y in years:
              live = published_part(base, y, "live.parquet")
              urls = [f"{base}/year={y}/{n}.parquet" for n in archive_part_names()
                      if published_part(base, y, f"{n}.parquet")]
              (plan / str(y)).mkdir()
              (plan / str(y) / "live").write_text("true" if live else "false")
              (plan / str(y) / "archive.urls").write_text(
                  "".join(f"{u}\n" for u in urls))
              print(f"year={y}: live {'published' if live else 'not published'}; "
                    f"{len(urls)} archive part(s)")
              for u in urls:
                  print(f"  {u}")
          EOF
      # One live.parquet per year in the slice, each merged with that
      # year's existing live so a fetch gap never truncates it. The plan
      # saw whether the previous live is published: 404 means the year's
      # first live and the build starts from the slice alone; 200 means
      # the GET must succeed, and any failure -- a 5xx, a timeout, a body
      # cut short -- stops the run. A live rebuilt from the five-day
      # slice alone would upload without complaint (its size differs),
      # and the next consolidation would fold it: every scene between the
      # last consolidation and today-5d gone from the archive for good,
      # with no signal. The dedupe rule resolves duplicates within live;
      # the year's archive parts are the floor: every id they hold is
      # dropped from live before the sort (--exclude-ids-from), so live
      # and archive never overlap and a glob over the year reads each
      # scene once.
      - name: Rebuild the live part of every year in the slice
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
          while read -r Y; do
            [ -n "$Y" ] || continue
            SRC="./staging/chunks"
            if [ "$(cat "staging/plan/$Y/live")" = "true" ]; then
              curl -fSL -o "staging/live-prev-$Y.parquet" "$BASE/year=$Y/live.parquet" || {
                rm -f "staging/live-prev-$Y.parquet"
                echo "::error::year=$Y/live.parquet: GET failed after the plan saw it published; a live rebuilt without it would lose every scene since the last consolidation"
                exit 1
              }
              SRC="$SRC staging/live-prev-$Y.parquet"
            else
              echo "year=$Y/live.parquet: not published (404); building the year's first live from the slice alone"
            fi
            EXCLUDE=()
            if [ -s "staging/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging/plan/$Y/archive.urls"
              EXCLUDE=(--exclude-ids-from "${URLS[@]}")
            fi
            # $SRC is unquoted on purpose: a word list. EXCLUDE expands to
            # nothing when the year has no archive part yet (the ${a[@]+...}
            # form, so an empty array is not an unbound variable under -u).
            python3 tools/s2_build.py --sources $SRC --years "$Y" \
              --out ./staging/publish/sentinel-2-l2a --name live.parquet \
              ${EXCLUDE[@]+"${EXCLUDE[@]}"}
          done < staging/plan/years
      # Each year's sources are its published archive parts (the list the
      # plan wrote) plus the live.parquet just built, and every year in
      # the slice is recomputed in one --merge-years call. A year with no
      # archive part at all is allowed only when it is the current
      # calendar year: those are the new year's first days, before its
      # first consolidation, and live IS the whole year. Any other year
      # with no archive part is a broken catalog, not a smaller splice --
      # it fails.
      - name: Splice every year in the slice into stats
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog
          NOW=$(date -u +%Y)
          SRC=()
          YEARS=""
          while read -r Y; do
            [ -n "$Y" ] || continue
            if [ -s "staging/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging/plan/$Y/archive.urls"
              SRC+=("${URLS[@]}")
            elif [ "$Y" = "$NOW" ]; then
              echo "::notice::year=$Y: no archive part published yet (the year's first consolidation has not run); splicing it from live alone"
            else
              echo "::error::no archive part published under year=$Y, and $Y is not the current year; refusing to splice stats from live alone"
              exit 1
            fi
            SRC+=("./staging/publish/sentinel-2-l2a/year=$Y/live.parquet")
            YEARS="${YEARS:+$YEARS,}$Y"
          done < staging/plan/years
          echo "splicing year(s) $YEARS from:"; printf '  %s\n' "${SRC[@]}"
          python3 tools/s2_stats.py \
            --sources "${SRC[@]}" \
            --out ./staging/publish/stats \
            --merge-years "$YEARS" --existing "$BASE/stats/mgrs-monthly.parquet"
      # Both collections: the item index from its published parts plus the
      # live part just built, and the stats collection's extent, row count
      # and `updated` from the timeline the splice just wrote.
      - name: Restamp collection metadata
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          python3 tools/make_items.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_stats_collection.py --data-dir ./staging/publish/stats --remote-baseline
      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"
      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2
      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm
