name: refresh-daily

# Pull the last few days of Earth Search items into live.parquet, splice
# the years they touch into the stats table, restamp extents/counts,
# upload. Nothing is committed: the repository keeps only the stable
# catalog definition (firms-catalog model).
#
# Two jobs, one per collection, in sequence. `refresh` is the first
# collection (sentinel-2-l2a), unchanged. `refresh-c1` is Collection 1
# (sentinel-2-c1-l2a) and runs after it, under the same catalog-write
# concurrency group, only while the repository variable C1_LIVE_ENABLED
# is the string "true". The variable stays unset until the Collection 1
# backfill is published from RAILS, its metadata is committed and
# published, and publish-stats has run for it (tools/README.md, "Sync &
# backfill"): before that there is no year file to exclude ids from and
# no stats-c1 table to splice into. Off, the job is skipped, so the
# scheduled cron stays green, not a daily red X.
#
# The 5-day lookback covers Sentinel-2's hours-to-days publication latency;
# the dedupe rule in s2_build makes re-fetched days harmless within live,
# and --exclude-ids-from keeps live disjoint from the year's archive parts:
# after a consolidation the lookback re-fetches days the octants already
# hold, and without the exclusion those scenes were published twice for up
# to five days (49,942 of live's 84,675 rows on 2026-09-19), which broke the
# "a glob reads each scene once" promise and inflated the month's stats.
#
# Years come from the slice, not the calendar. From December 27th to
# January 2nd the lookback spans two years, and each year in it gets its
# own live.parquet (previous live + slice, minus that year's archive ids)
# and its own place in the stats splice. The old rule, `--years $(date
# +%Y)`, dropped the late-December scenes of the first January runs and,
# with the splice refusing a year that had no archive part, failed every
# run of the new year before anything was uploaded -- so the new year's
# live never existed and consolidate-month never had anything to fold.
# The splice now reads a year from live alone when it has no archive
# part yet, but only for the current calendar year: that is the new
# year's first days, before its first consolidation. Any other year
# with no archive part is a broken catalog and still fails.
#
# Collection 1 differs in three ways, and the second job is the first
# job's loop with those three changes:
#
#   - The lookback is on `created`, not `datetime` (s2_fetch --field
#     created). ESA is still reprocessing old years into Collection 1, so
#     a scene acquired in 2019 can be created this week; a lookback on
#     acquisition would never see it. The slice can therefore hold any
#     year, not only the current one and December's, and every year in it
#     gets its own live.parquet, the same per-year loop as the first job.
#   - The archive of a year is one items.parquet (no zone parts), built and
#     uploaded from RAILS; the exclusion list of a year is that one URL, or
#     nothing before the year file is published (the new year's first days,
#     or a year the backfill has not reached). archive_part_names() with the
#     Collection 1 config says so, the same call as the first job.
#   - Live is written at zstd 3 (s2_collections live_zstd_level), because it
#     is rewritten daily and can hold a whole year: nothing on GitHub folds
#     it. A fold on RAILS (tools/rails/fold_live.sbatch, every month or two)
#     merges each live into its year file and empties it; until then a glob
#     over the year reads both files, and the dedupe on id keeps the
#     reprocessed copy. A live that has grown for a year is a bigger
#     download and a longer build here, which is what the fold duty bounds.
#
# Each job ends with tools/publish.py, which uploads every changed file under
# catalog/, so each job restamps both collections and both stats
# collections before it publishes: the collection it refreshed from what it
# staged, the other from the published parts (--remote-baseline). Without
# that, the second job would put the committed sentinel-2-l2a metadata over
# the copies the first job had just restamped, and the first job would do
# the same to Collection 1 the next morning. The Collection 1 pair is
# restamped only under C1_LIVE_ENABLED, because before then its committed
# metadata is the truth (and stats-c1 has no published timeline to read).
#
# Bootstrap guard: on a fresh repo nothing is published yet (the backfill
# and publish-backfill pipeline runs once, separately, to seed the catalog).
# The first step here probes for catalog.json and every other step is
# gated on that succeeding, so the scheduled cron is a green no-op --
# not a daily red X -- until the first publish lands.

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:

# Permissions per job, not per workflow: with two jobs, zizmor's
# excessive-permissions audit wants each job to ask for its own OIDC token.
concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to refresh"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"
      # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' \
            'rashid>=0.1.8,<0.2.0' stac-check
      - name: Fetch the lookback window
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          START=$(date -u -d "5 days ago" +%F)
          END=$(date -u +%F)
          python3 tools/s2_fetch.py --start "$START" --end "$END" \
            --out ./staging/chunks
      # One round of probes for every year in the slice, through
      # s2_build.published_part (retried; a code that is not 200 or 404
      # stops the run): is that year's live.parquet published, and which
      # of its archive parts are. The archive is items.parquet for a year
      # published whole (2015-2018), the four z*.parquet UTM-zone
      # quartiles for 2019-2020, or the eight octants from 2021 (spec
      # Amendment 3); the names come from tools/s2_build.py
      # archive_part_names() so this cannot drift from the builder. An
      # empty part list (a year with no consolidation yet) is allowed
      # here; the stats step decides what it means for the splice. The
      # answers land under staging/plan/ as plain files for the bash
      # steps below.
      - name: Plan every year in the slice
        if: steps.guard.outputs.published == 'true'
        env:
          BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, sys
          from pathlib import Path
          import duckdb
          sys.path.insert(0, "tools")
          from s2_build import archive_part_names, gather, published_part
          base = os.environ["BASE"]
          files = gather(["staging/chunks"])
          lst = ",".join(f"'{f}'" for f in files)
          con = duckdb.connect()
          con.execute("SET TimeZone='UTC';")   # the build's year() zone
          years = [r[0] for r in con.execute(
              f"SELECT DISTINCT year(datetime) AS y "
              f"FROM read_parquet([{lst}], union_by_name=true) ORDER BY y"
          ).fetchall()]
          if not years:
              raise SystemExit("the lookback slice holds no rows")
          plan = Path("staging/plan")
          plan.mkdir(parents=True)
          (plan / "years").write_text("".join(f"{y}\n" for y in years))
          for y in years:
              live = published_part(base, y, "live.parquet")
              urls = [f"{base}/year={y}/{n}.parquet" for n in archive_part_names()
                      if published_part(base, y, f"{n}.parquet")]
              (plan / str(y)).mkdir()
              (plan / str(y) / "live").write_text("true" if live else "false")
              (plan / str(y) / "archive.urls").write_text(
                  "".join(f"{u}\n" for u in urls))
              print(f"year={y}: live {'published' if live else 'not published'}; "
                    f"{len(urls)} archive part(s)")
              for u in urls:
                  print(f"  {u}")
          EOF
      # One live.parquet per year in the slice, each merged with that
      # year's existing live so a fetch gap never truncates it. The plan
      # saw whether the previous live is published: 404 means the year's
      # first live and the build starts from the slice alone; 200 means
      # the GET must succeed, and any failure -- a 5xx, a timeout, a body
      # cut short -- stops the run. A live rebuilt from the five-day
      # slice alone would upload without complaint (its size differs),
      # and the next consolidation would fold it: every scene between the
      # last consolidation and today-5d gone from the archive for good,
      # with no signal. The dedupe rule resolves duplicates within live;
      # the year's archive parts are the floor: every id they hold is
      # dropped from live before the sort (--exclude-ids-from), so live
      # and archive never overlap and a glob over the year reads each
      # scene once.
      - name: Rebuild the live part of every year in the slice
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
          while read -r Y; do
            [ -n "$Y" ] || continue
            SRC="./staging/chunks"
            if [ "$(cat "staging/plan/$Y/live")" = "true" ]; then
              curl -fSL -o "staging/live-prev-$Y.parquet" "$BASE/year=$Y/live.parquet" || {
                rm -f "staging/live-prev-$Y.parquet"
                echo "::error::year=$Y/live.parquet: GET failed after the plan saw it published; a live rebuilt without it would lose every scene since the last consolidation"
                exit 1
              }
              SRC="$SRC staging/live-prev-$Y.parquet"
            else
              echo "year=$Y/live.parquet: not published (404); building the year's first live from the slice alone"
            fi
            EXCLUDE=()
            if [ -s "staging/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging/plan/$Y/archive.urls"
              EXCLUDE=(--exclude-ids-from "${URLS[@]}")
            fi
            # $SRC is unquoted on purpose: a word list. EXCLUDE expands to
            # nothing when the year has no archive part yet (the ${a[@]+...}
            # form, so an empty array is not an unbound variable under -u).
            python3 tools/s2_build.py --sources $SRC --years "$Y" \
              --out ./staging/publish/sentinel-2-l2a --name live.parquet \
              ${EXCLUDE[@]+"${EXCLUDE[@]}"}
          done < staging/plan/years
      # Each year's sources are its published archive parts (the list the
      # plan wrote) plus the live.parquet just built, and every year in
      # the slice is recomputed in one --merge-years call. A year with no
      # archive part at all is allowed only when it is the current
      # calendar year: those are the new year's first days, before its
      # first consolidation, and live IS the whole year. Any other year
      # with no archive part is a broken catalog, not a smaller splice --
      # it fails.
      - name: Splice every year in the slice into stats
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog
          NOW=$(date -u +%Y)
          SRC=()
          YEARS=""
          while read -r Y; do
            [ -n "$Y" ] || continue
            if [ -s "staging/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging/plan/$Y/archive.urls"
              SRC+=("${URLS[@]}")
            elif [ "$Y" = "$NOW" ]; then
              echo "::notice::year=$Y: no archive part published yet (the year's first consolidation has not run); splicing it from live alone"
            else
              echo "::error::no archive part published under year=$Y, and $Y is not the current year; refusing to splice stats from live alone"
              exit 1
            fi
            SRC+=("./staging/publish/sentinel-2-l2a/year=$Y/live.parquet")
            YEARS="${YEARS:+$YEARS,}$Y"
          done < staging/plan/years
          echo "splicing year(s) $YEARS from:"; printf '  %s\n' "${SRC[@]}"
          python3 tools/s2_stats.py \
            --sources "${SRC[@]}" \
            --out ./staging/publish/stats \
            --merge-years "$YEARS" --existing "$BASE/stats/mgrs-monthly.parquet"
      # The first collection and its stats: the item index from its
      # published parts plus the live part just built, and the stats
      # collection's extent, row count and `updated` from the timeline the
      # splice just wrote.
      - name: Restamp collection metadata
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          python3 tools/make_items.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_stats_collection.py --data-dir ./staging/publish/stats --remote-baseline
      # Collection 1 and stats-c1 from the bucket, because tools/publish.py
      # below uploads all of catalog/ and refresh-c1 restamped them
      # yesterday from a live part this checkout does not have. Same recipe
      # as publish-stats: an empty year marker for every mission year, then
      # both generators read the published parts (--remote-baseline); a
      # year with nothing published is skipped. The stats collection reads
      # the published stats-c1 timeline, which exists only once
      # publish-stats has run for Collection 1: a 404 keeps the committed
      # collection (the truth until then) and says so, so the variable set
      # a day before that dispatch cannot fail the first collection's
      # refresh; any other answer stops this step. Only under
      # C1_LIVE_ENABLED: before that the committed Collection 1 metadata is
      # the truth. continue-on-error: this step is a courtesy to Collection
      # 1 that refresh-c1 repeats minutes later and fails loudly on when
      # its state is wrong (the variable set before any year is published,
      # say); a Collection 1 problem must not cost the first collection its
      # day. Every way this step can stop leaves catalog/ valid -- an item
      # is written whole or not at all -- and the gates below still run.
      - name: Restamp Collection 1 metadata from its published parts
        if: steps.guard.outputs.published == 'true' && vars.C1_LIVE_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          TIMELINE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/stats-c1/timeline.parquet
          for y in $(seq 2015 "$(date -u +%Y)"); do
            mkdir -p "staging/baseline/sentinel-2-c1-l2a/year=$y"
          done
          python3 tools/make_items.py --collection sentinel-2-c1-l2a \
            --data-dir ./staging/baseline/sentinel-2-c1-l2a --remote-baseline
          python3 tools/make_collection.py --collection sentinel-2-c1-l2a \
            --data-dir ./staging/baseline/sentinel-2-c1-l2a --remote-baseline
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I "$TIMELINE")
          case "$CODE" in
            200)
              python3 tools/make_stats_collection.py --collection sentinel-2-c1-l2a \
                --data-dir ./staging/baseline/stats-c1 --remote-baseline ;;
            404)
              echo "::notice::stats-c1/timeline.parquet is not published (publish-stats has not run for Collection 1); keeping the committed stats-c1 collection" ;;
            *)
              echo "::error::stats-c1/timeline.parquet: HEAD answered $CODE, not 200 or 404"
              exit 1 ;;
          esac
      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"
      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2
      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm

  # Collection 1: the same loop on a `created` lookback, one items.parquet
  # per year as the archive, live at zstd 3, no consolidation here (the
  # header says why). `needs: refresh` orders the two publishes; the job
  # still runs when the first collection's job failed (`!cancelled()`),
  # because the two tails are independent and a day of Collection 1 should
  # not wait on an Earth Search error in the other window. Its own staging
  # tree (staging-c1/) so nothing of the first job's is assumed.
  refresh-c1:
    needs: refresh
    if: ${{ !cancelled() && vars.C1_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      COLLECTION: sentinel-2-c1-l2a
      BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-c1-l2a
      STATS_BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/stats-c1
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to refresh"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"
      # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' \
            'rashid>=0.1.8,<0.2.0' stac-check
      # --field created: the window is on the API's `created` property, so
      # a scene ESA reprocessed this week is fetched whatever its
      # acquisition date (tools/s2_fetch.py says how the query is formed).
      - name: Fetch the lookback window on created
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          START=$(date -u -d "5 days ago" +%F)
          END=$(date -u +%F)
          python3 tools/s2_fetch.py --collection "$COLLECTION" --field created \
            --start "$START" --end "$END" --out ./staging-c1/chunks
      # The first job's plan with the Collection 1 config: the years are
      # year(datetime) of the slice (a `created` lookback can touch any
      # year), the archive names come from archive_part_names(config) --
      # one items.parquet -- and every probe goes through published_part
      # (retried; a code that is not 200 or 404 stops the run). The plan
      # also writes the collection's live zstd level from
      # tools/s2_collections.py, so the build step cannot drift from it.
      - name: Plan every year in the slice
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, sys
          from pathlib import Path
          import duckdb
          sys.path.insert(0, "tools")
          import s2_collections as cols
          from s2_build import archive_part_names, gather, published_part
          base = os.environ["BASE"]
          config = cols.get(os.environ["COLLECTION"])
          files = gather(["staging-c1/chunks"])
          lst = ",".join(f"'{f}'" for f in files)
          con = duckdb.connect()
          con.execute("SET TimeZone='UTC';")   # the build's year() zone
          years = [r[0] for r in con.execute(
              f"SELECT DISTINCT year(datetime) AS y "
              f"FROM read_parquet([{lst}], union_by_name=true) ORDER BY y"
          ).fetchall()]
          if not years:
              raise SystemExit("the lookback slice holds no rows")
          plan = Path("staging-c1/plan")
          plan.mkdir(parents=True)
          (plan / "years").write_text("".join(f"{y}\n" for y in years))
          (plan / "live-zstd-level").write_text(f"{config.live_zstd_level}\n")
          for y in years:
              live = published_part(base, y, "live.parquet")
              urls = [f"{base}/year={y}/{n}.parquet"
                      for n in archive_part_names(config)
                      if published_part(base, y, f"{n}.parquet")]
              (plan / str(y)).mkdir()
              (plan / str(y) / "live").write_text("true" if live else "false")
              (plan / str(y) / "archive.urls").write_text(
                  "".join(f"{u}\n" for u in urls))
              print(f"year={y}: live {'published' if live else 'not published'}; "
                    f"{len(urls)} archive part(s)")
              for u in urls:
                  print(f"  {u}")
          EOF
      # The first job's live loop: previous live (its GET must succeed once
      # the plan saw it) plus the slice, minus every id the year file holds
      # at the same or a newer generation (--exclude-ids-from; a reprocessed
      # scene is newer and stays in live for the next fold). A year with no
      # year file yet is built from the slice and the previous live alone.
      # Written at the collection's live level (zstd 3): the file is
      # rewritten daily and the fold on RAILS re-encodes it at 18.
      - name: Rebuild the live part of every year in the slice
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          LEVEL=$(cat staging-c1/plan/live-zstd-level)
          while read -r Y; do
            [ -n "$Y" ] || continue
            SRC="./staging-c1/chunks"
            if [ "$(cat "staging-c1/plan/$Y/live")" = "true" ]; then
              curl -fSL -o "staging-c1/live-prev-$Y.parquet" "$BASE/year=$Y/live.parquet" || {
                rm -f "staging-c1/live-prev-$Y.parquet"
                echo "::error::year=$Y/live.parquet: GET failed after the plan saw it published; a live rebuilt without it would lose every scene since the last fold"
                exit 1
              }
              SRC="$SRC staging-c1/live-prev-$Y.parquet"
            else
              echo "year=$Y/live.parquet: not published (404); building the year's first live from the slice alone"
            fi
            EXCLUDE=()
            if [ -s "staging-c1/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging-c1/plan/$Y/archive.urls"
              EXCLUDE=(--exclude-ids-from "${URLS[@]}")
            else
              echo "year=$Y/items.parquet: not published (404); nothing to exclude from live"
            fi
            # $SRC is unquoted on purpose: a word list. EXCLUDE expands to
            # nothing when the year has no year file yet (the ${a[@]+...}
            # form, so an empty array is not an unbound variable under -u).
            python3 tools/s2_build.py --collection "$COLLECTION" \
              --sources $SRC --years "$Y" \
              --out "./staging-c1/publish/$COLLECTION" --name live.parquet \
              --zstd-level "$LEVEL" \
              ${EXCLUDE[@]+"${EXCLUDE[@]}"}
          done < staging-c1/plan/years
      # The first job's splice with --collection: each year from its year
      # file plus the live just built. A year with no year file is spliced
      # from live alone only when it is the current calendar year (its
      # first days, before the first fold); any other year with no year
      # file means the backfill has not published it, and stats for it
      # from a five-day slice would replace the year's whole table with a
      # handful of rows -- it fails, before anything is uploaded.
      - name: Splice every year in the slice into stats
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y)
          SRC=()
          YEARS=""
          while read -r Y; do
            [ -n "$Y" ] || continue
            if [ -s "staging-c1/plan/$Y/archive.urls" ]; then
              mapfile -t URLS < "staging-c1/plan/$Y/archive.urls"
              SRC+=("${URLS[@]}")
            elif [ "$Y" = "$NOW" ]; then
              echo "::notice::year=$Y: no year file published yet (the year's first fold has not run); splicing it from live alone"
            else
              echo "::error::no year file published under year=$Y, and $Y is not the current year; refusing to splice stats from live alone"
              exit 1
            fi
            SRC+=("./staging-c1/publish/$COLLECTION/year=$Y/live.parquet")
            YEARS="${YEARS:+$YEARS,}$Y"
          done < staging-c1/plan/years
          echo "splicing year(s) $YEARS from:"; printf '  %s\n' "${SRC[@]}"
          python3 tools/s2_stats.py --collection "$COLLECTION" \
            --sources "${SRC[@]}" \
            --out ./staging-c1/publish/stats-c1 \
            --merge-years "$YEARS" --existing "$STATS_BASE/mgrs-monthly.parquet"
      # Collection 1 from the live parts just built plus its published year
      # files, for every mission year (an empty marker per year): a fold on
      # RAILS may have replaced a year file since its item was last
      # committed, and the bucket's item should say what the bucket holds.
      # Then the first collection and its stats from the published parts,
      # because tools/publish.py below uploads all of catalog/ and the
      # `refresh` job restamped them minutes ago from a live part this
      # checkout does not have (the header says why). The baseline markers
      # live outside staging-c1/publish so upload_data.py never walks them.
      - name: Restamp collection metadata
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          for y in $(seq 2015 "$(date -u +%Y)"); do
            mkdir -p "staging-c1/publish/$COLLECTION/year=$y"
            mkdir -p "staging-c1/baseline/sentinel-2-l2a/year=$y"
          done
          python3 tools/make_items.py --collection "$COLLECTION" \
            --data-dir "./staging-c1/publish/$COLLECTION" --remote-baseline
          python3 tools/make_collection.py --collection "$COLLECTION" \
            --data-dir "./staging-c1/publish/$COLLECTION" --remote-baseline
          python3 tools/make_stats_collection.py --collection "$COLLECTION" \
            --data-dir ./staging-c1/publish/stats-c1
          python3 tools/make_items.py \
            --data-dir ./staging-c1/baseline/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py \
            --data-dir ./staging-c1/baseline/sentinel-2-l2a --remote-baseline
          python3 tools/make_stats_collection.py \
            --data-dir ./staging-c1/baseline/stats --remote-baseline
      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"
      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-c1
          aws-region: us-west-2
      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging-c1/publish
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm
