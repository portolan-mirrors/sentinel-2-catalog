name: publish-stats

# Build the mgrs-monthly stats table (with its months/YYYY-MM.parquet slices
# and timeline.parquet) and the mgrs.pmtiles footprint tileset from the
# PUBLISHED year parts (HTTP reads, no artifacts) and upload them all.
#
# One matrix entry per collection, run one at a time (max-parallel 1,
# because each entry ends with tools/publish.py and two publishes of
# catalog/ at once would race): sentinel-2-l2a into catalog/stats, and
# sentinel-2-c1-l2a into catalog/stats-c1. The Collection 1 entry runs only
# while the repository variable C1_LIVE_ENABLED is the string "true" (the
# same switch as refresh-daily's Collection 1 job); off, its guard says so
# and the entry is a green no-op. The order to bring Collection 1 up
# (tools/README.md, "Sync & backfill"): publish the backfill from RAILS,
# commit and publish its metadata, set the variable, dispatch this workflow
# to seed stats-c1, and the next refresh-daily cron splices into it.
#
# Why this exists as its own workflow: after the first data publish,
# catalog/stats/ metadata (committed, static) references mgrs-monthly.parquet
# and mgrs.pmtiles that nothing has built at full scale or uploaded yet --
# publish-backfill's finalize job never touches stats. And once a catalog is
# published, refresh-daily's "splice current year into stats" step passes
# --existing "$BASE/stats/mgrs-monthly.parquet" to s2_stats.py, which will
# 404 until that file exists at all. Run this once, manually, right after
# the first publish to seed it. The same holds for stats-c1: refresh-daily's
# Collection 1 job splices into a table only this workflow creates.
#
# It doubles as the periodic full-rebuild path (footprints included) after
# big archive changes (a repair run, a large backfill correction, a fold on
# RAILS) where the incremental --merge-years splice in refresh-daily is not
# enough.
#
# Bootstrap guard: same reasoning as refresh-daily.yml -- on a fresh repo
# nothing is published yet, so the first step probes for catalog.json and
# every other step is gated on that succeeding. A dispatch before the first
# publish is a green no-op, not a red X.
#
# No glob over HTTP: DuckDB's read_parquet only expands glob patterns
# (year=*/*.parquet) for filesystem paths and object-store URLs it lists
# itself (s3://, gs://, ...); a plain https:// URL is fetched literally, so
# a glob there 404s instead of expanding. tools/s2_stats.py's _sources_sql
# does no expansion of its own either -- a URL source is passed straight
# through. So the "enumerate published parts" step below resolves the glob
# itself, by probing, and the build step gets an explicit list of URLs.
#
# The stats collection.json is committed, but three of its fields are
# measured, not typed: the temporal extent, the row count and `updated`.
# tools/make_stats_collection.py stamps them from the timeline this run
# writes, the catalog is validated, and tools/publish.py uploads the
# metadata after the data -- otherwise the published collection keeps
# describing whatever table it was last stamped from (it claimed the
# two-day pilot slice for days after the full table was up).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # live_years: which years' live.parquet to probe. The first
          # collection's live is the current year's (consolidate-month
          # folds the rest); a Collection 1 live can sit under any year,
          # because its lookback is on `created` and ESA reprocesses old
          # years, so every mission year is probed.
          - collection: sentinel-2-l2a
            stats_dir: stats
            live_years: current
            artifact: mgrs-tiles
          - collection: sentinel-2-c1-l2a
            stats_dir: stats-c1
            live_years: all
            artifact: mgrs-tiles-c1
    env:
      COLLECTION: ${{ matrix.collection }}
      STATS_DIR: ${{ matrix.stats_dir }}
      LIVE_YEARS: ${{ matrix.live_years }}
      BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/${{ matrix.collection }}
      C1_LIVE_ENABLED: ${{ vars.C1_LIVE_ENABLED }}
    steps:
      - name: Check the catalog is published and this collection is enabled
        id: guard
        run: |
          set -uo pipefail
          if [ "$COLLECTION" = sentinel-2-c1-l2a ] && [ "$C1_LIVE_ENABLED" != true ]; then
            echo "::notice::C1_LIVE_ENABLED is not 'true'; nothing to build for $COLLECTION"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to build stats from"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"

      # tippecanoe is needed because --footprints drives `gpio pmtiles
      # create`, which shells out to it (same install as ci.yml's pytest
      # job, which exercises the same code path against a tiny fixture).
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' pmtiles pytz \
            'rashid>=0.1.8,<0.2.0' stac-check

      # Resolve the "every published year part" glob by hand: probe every
      # archive part name a year can hold -- for the first collection
      # items.parquet for a year published whole (2015-2018), the four
      # z*.parquet UTM-zone quartiles for 2019-2020, the eight octants from
      # 2021 (spec Amendment 3); for Collection 1 one items.parquet per
      # year; the names come from tools/s2_build.py archive_part_names()
      # with the collection's config so this list cannot drift from the
      # builder -- from 2015 (Sentinel-2's launch year) through the current
      # year with a HEAD request, plus live.parquet for the years
      # LIVE_YEARS names, if refresh-daily has published one. A 404 is a
      # part that does not exist for that year, which is the normal case
      # for most of the names; any other answer is a part this run cannot
      # see and would silently leave out of the stats, so it fails the
      # job. Loud failure too if the guard passed (catalog.json exists) but
      # this finds nothing -- that combination means the catalog is
      # published but empty/broken, never a quiet reason to skip.
      - name: Enumerate published year parts
        id: enumerate
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          CURRENT_YEAR=$(date -u +%Y)
          ARCHIVE_NAMES=$(python3 -c '
          import os, sys; sys.path.insert(0, "tools")
          import s2_collections as cols
          from s2_build import archive_part_names
          print(" ".join(archive_part_names(cols.get(os.environ["COLLECTION"]))))')
          # probe <year> <name>: 0 if year=<year>/<name>.parquet is published,
          # 1 if it answers 404; anything else stops the job.
          probe() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$BASE/year=$1/$2.parquet")
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::year=$1/$2.parquet: HEAD answered $code, not 200 or 404"; exit 1 ;;
            esac
          }
          urls=()
          for Y in $(seq 2015 "$CURRENT_YEAR"); do
            for NAME in $ARCHIVE_NAMES; do
              if probe "$Y" "$NAME"; then
                urls+=("$BASE/year=$Y/$NAME.parquet")
              fi
            done
            if [ "$LIVE_YEARS" = all ] || [ "$Y" = "$CURRENT_YEAR" ]; then
              if probe "$Y" live; then
                urls+=("$BASE/year=$Y/live.parquet")
              fi
            fi
          done
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::catalog.json is published but zero year parts were found under $BASE -- refusing to build stats from nothing"
            exit 1
          fi
          echo "found ${#urls[@]} published part(s):"
          printf '  %s\n' "${urls[@]}"
          {
            echo "urls<<PARTS_EOF"
            printf '%s\n' "${urls[@]}"
            echo "PARTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build stats and footprints at full scale
        if: steps.guard.outputs.published == 'true'
        env:
          PART_URLS: ${{ steps.enumerate.outputs.urls }}
        run: |
          set -euo pipefail
          mapfile -t URLS <<< "$PART_URLS"
          python3 tools/s2_stats.py --collection "$COLLECTION" \
            --sources "${URLS[@]}" \
            --out "./staging/publish/$STATS_DIR" --footprints \
            --keep-footprint-table

      # mgrs-tiles.parquet (the ~33k-polygon tile-envelope table behind
      # mgrs.pmtiles) is kept so the tileset can be rebuilt and A/B-tested
      # locally without rescanning every published year part, but it must
      # never reach the bucket: upload_data.py uploads every .parquet under
      # --data-dir (./staging/publish), with no exception for intermediates.
      # Move it out of that tree before the upload step runs.
      - name: Move the footprint table out of the publish dir
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          mv "./staging/publish/$STATS_DIR/mgrs-tiles.parquet" ./staging/

      # This collection's stats collection from the timeline just written;
      # then every other collection tools/publish.py below would touch,
      # from the bucket, because publish.py uploads all of catalog/:
      # without the restamp it would put the committed sentinel-2-l2a
      # collection.json and year items over the copies refresh-daily
      # restamped from the live part, and the other stats collection's
      # committed extent over its published one. Same recipe as
      # refresh-daily: an empty year marker for every mission year, then
      # both generators from the published parts (--remote-baseline), and
      # the stats collection from its published timeline. The Collection 1
      # pair only under C1_LIVE_ENABLED: before that its committed metadata
      # is the truth. On the dispatch that seeds stats-c1 the first entry
      # runs before the Collection 1 entry has published a timeline, so the
      # timeline is probed through s2_build.published_url (retried; exit 0
      # published, 3 not, anything else could not answer): a 404 keeps the
      # committed stats-c1 collection and says so; an unanswered probe
      # stops the job. The variable set before any Collection 1 year is
      # published fails the Collection 1 entry here with "nothing to
      # describe" (make_collection): the documented order publishes the
      # backfill first.
      - name: Restamp collection metadata
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          TIMELINE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/stats-c1/timeline.parquet
          python3 tools/make_stats_collection.py --collection "$COLLECTION" \
            --data-dir "./staging/publish/$STATS_DIR"
          for y in $(seq 2015 "$(date -u +%Y)"); do
            mkdir -p "staging/baseline/sentinel-2-l2a/year=$y"
            mkdir -p "staging/baseline/sentinel-2-c1-l2a/year=$y"
          done
          python3 tools/make_items.py \
            --data-dir ./staging/baseline/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py \
            --data-dir ./staging/baseline/sentinel-2-l2a --remote-baseline
          if [ "$STATS_DIR" != stats ]; then
            python3 tools/make_stats_collection.py \
              --data-dir ./staging/baseline/stats --remote-baseline
          fi
          if [ "$C1_LIVE_ENABLED" = true ]; then
            python3 tools/make_items.py --collection sentinel-2-c1-l2a \
              --data-dir ./staging/baseline/sentinel-2-c1-l2a --remote-baseline
            python3 tools/make_collection.py --collection sentinel-2-c1-l2a \
              --data-dir ./staging/baseline/sentinel-2-c1-l2a --remote-baseline
            if [ "$STATS_DIR" != stats-c1 ]; then
              CODE=0
              python3 -c '
          import sys; sys.path.insert(0, "tools")
          from s2_build import published_url
          sys.exit(0 if published_url(sys.argv[1], what="stats-c1/timeline.parquet") else 3)' \
                "$TIMELINE" || CODE=$?
              case "$CODE" in
                0)
                  python3 tools/make_stats_collection.py --collection sentinel-2-c1-l2a \
                    --data-dir ./staging/baseline/stats-c1 --remote-baseline ;;
                3)
                  echo "::notice::stats-c1/timeline.parquet is not published yet; keeping the committed stats-c1 collection" ;;
                *)
                  echo "::error::stats-c1/timeline.parquet: the probe could not answer (exit $CODE; published_url said why above)"
                  exit 1 ;;
              esac
            fi
          fi

      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"

      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.stats_dir }}
          aws-region: us-west-2

      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish

      # After the data, so the stamped extent never describes a table that
      # is not up yet.
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm

      # Uploaded as a workflow artifact (not to the bucket) so the tileset
      # can be independently rebuilt and compared locally -- tippecanoe vs
      # tylertoo A/B -- without rescanning 20+ GB of published parts.
      - name: Upload the MGRS tile-envelope table as a workflow artifact
        if: steps.guard.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./staging/mgrs-tiles.parquet
          retention-days: 14
          if-no-files-found: error
