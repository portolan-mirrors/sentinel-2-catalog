name: publish-stats

# Build the mgrs-monthly stats table (with its months/YYYY-MM.parquet slices
# and timeline.parquet) and the mgrs.pmtiles footprint tileset from the
# PUBLISHED year parts (HTTP reads, no artifacts) and upload them all.
#
# Why this exists as its own workflow: after the first data publish,
# catalog/stats/ metadata (committed, static) references mgrs-monthly.parquet
# and mgrs.pmtiles that nothing has built at full scale or uploaded yet --
# publish-backfill's finalize job never touches stats. And once a catalog is
# published, refresh-daily's "splice current year into stats" step passes
# --existing "$BASE/stats/mgrs-monthly.parquet" to s2_stats.py, which will
# 404 until that file exists at all. Run this once, manually, right after
# the first publish to seed it.
#
# It doubles as the periodic full-rebuild path (footprints included) after
# big archive changes (a repair run, a large backfill correction) where the
# incremental --merge-years splice in refresh-daily is not enough.
#
# Bootstrap guard: same reasoning as refresh-daily.yml -- on a fresh repo
# nothing is published yet, so the first step probes for catalog.json and
# every other step is gated on that succeeding. A dispatch before the first
# publish is a green no-op, not a red X.
#
# No glob over HTTP: DuckDB's read_parquet only expands glob patterns
# (year=*/*.parquet) for filesystem paths and object-store URLs it lists
# itself (s3://, gs://, ...); a plain https:// URL is fetched literally, so
# a glob there 404s instead of expanding. tools/s2_stats.py's _sources_sql
# does no expansion of its own either -- a URL source is passed straight
# through. So the "enumerate published parts" step below resolves the glob
# itself, by probing, and the build step gets an explicit list of URLs.
#
# The stats collection.json is committed, but three of its fields are
# measured, not typed: the temporal extent, the row count and `updated`.
# tools/make_stats_collection.py stamps them from the timeline this run
# writes, the catalog is validated, and tools/publish.py uploads the
# metadata after the data -- otherwise the published collection keeps
# describing whatever table it was last stamped from (it claimed the
# two-day pilot slice for days after the full table was up).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to build stats from"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"

      # tippecanoe is needed because --footprints drives `gpio pmtiles
      # create`, which shells out to it (same install as ci.yml's pytest
      # job, which exercises the same code path against a tiny fixture).
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' pmtiles pytz \
            'rashid>=0.1.8,<0.2.0' stac-check

      # Resolve the "every published year part" glob by hand: probe every
      # archive part name a year can hold -- items.parquet for a year
      # published whole (2015-2018), the four z*.parquet UTM-zone quartiles
      # for 2019-2020, the eight octants from 2021 (spec Amendment 3; the
      # names come from tools/s2_build.py archive_part_names() so this list
      # cannot drift from the builder) -- from 2015 (Sentinel-2's launch
      # year) through the current year with a HEAD request, plus the
      # current year's live.parquet if refresh-daily has published one
      # yet. A 404 is a part that does not exist for that year, which is
      # the normal case for most of the thirteen names; any other answer
      # is a part this run cannot see and would
      # silently leave out of the stats, so it fails the job. Loud failure
      # too if the guard passed (catalog.json exists) but this finds
      # nothing -- that combination means the catalog is published but
      # empty/broken, never a quiet reason to skip.
      - name: Enumerate published year parts
        id: enumerate
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          BASE=https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a
          CURRENT_YEAR=$(date -u +%Y)
          ARCHIVE_NAMES=$(python3 -c '
          import sys; sys.path.insert(0, "tools")
          from s2_build import archive_part_names
          print(" ".join(archive_part_names()))')
          # probe <year> <name>: 0 if year=<year>/<name>.parquet is published,
          # 1 if it answers 404; anything else stops the job.
          probe() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$BASE/year=$1/$2.parquet")
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::year=$1/$2.parquet: HEAD answered $code, not 200 or 404"; exit 1 ;;
            esac
          }
          urls=()
          for Y in $(seq 2015 "$CURRENT_YEAR"); do
            for NAME in $ARCHIVE_NAMES; do
              if probe "$Y" "$NAME"; then
                urls+=("$BASE/year=$Y/$NAME.parquet")
              fi
            done
          done
          if probe "$CURRENT_YEAR" live; then
            urls+=("$BASE/year=$CURRENT_YEAR/live.parquet")
          fi
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::catalog.json is published but zero year parts were found under $BASE -- refusing to build stats from nothing"
            exit 1
          fi
          echo "found ${#urls[@]} published part(s):"
          printf '  %s\n' "${urls[@]}"
          {
            echo "urls<<PARTS_EOF"
            printf '%s\n' "${urls[@]}"
            echo "PARTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build stats and footprints at full scale
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          mapfile -t URLS <<< "${{ steps.enumerate.outputs.urls }}"
          python3 tools/s2_stats.py --sources "${URLS[@]}" \
            --out ./staging/publish/stats --footprints \
            --keep-footprint-table

      # mgrs-tiles.parquet (the ~33k-polygon tile-envelope table behind
      # mgrs.pmtiles) is kept so the tileset can be rebuilt and A/B-tested
      # locally without rescanning every published year part, but it must
      # never reach the bucket: upload_data.py uploads every .parquet under
      # --data-dir (./staging/publish), with no exception for intermediates.
      # Move it out of that tree before the upload step runs.
      - name: Move the footprint table out of the publish dir
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          mv ./staging/publish/stats/mgrs-tiles.parquet ./staging/

      - name: Restamp the stats collection from the timeline
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/make_stats_collection.py --data-dir ./staging/publish/stats

      - name: Validate before upload
        if: steps.guard.outputs.published == 'true'
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"

      - name: Assume the Source Cooperative write role
        if: steps.guard.outputs.published == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2

      - name: Upload data
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish

      # After the data, so the stamped extent never describes a table that
      # is not up yet.
      - name: Publish catalog metadata
        if: steps.guard.outputs.published == 'true'
        run: python3 tools/publish.py --confirm

      # Uploaded as a workflow artifact (not to the bucket) so the tileset
      # can be independently rebuilt and compared locally -- tippecanoe vs
      # tylertoo A/B -- without rescanning 20+ GB of published parts.
      - name: Upload the MGRS tile-envelope table as a workflow artifact
        if: steps.guard.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mgrs-tiles
          path: ./staging/mgrs-tiles.parquet
          retention-days: 14
          if-no-files-found: error
