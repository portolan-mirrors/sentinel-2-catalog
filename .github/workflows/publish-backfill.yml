name: publish-backfill

# Turn the month-slice artifacts backfill.yml produced into the published,
# year-partitioned GeoParquet index -- the first, credentialed publish of the
# whole Earth Search record.
#
# Three stages, on purpose:
#
#   plan        No cloud credentials. Lists every non-expired slice-*
#               artifact (paginated -- ~135 of them, one page is not enough),
#               groups the month ids by year, and turns that into a matrix.
#
#   build-year  One matrix job per year, max-parallel 1. Each job is its own
#               runner: it downloads only that year's slice artifacts (by
#               id, since actions/download-artifact needs a run id or it
#               only sees the CURRENT run's artifacts, and the slices were
#               uploaded by backfill.yml's run, not this one), assumes the
#               Source Cooperative role, and builds that year's parquet
#               part by part, uploading each part the moment it passes its
#               check (s2_build.py --on-part-done) and skipping any part
#               the bucket already has (--skip-existing-url). So a job that
#               hits the six-hour ceiling has published everything it
#               finished, and re-dispatching the year builds only the rest:
#               2021 (8.65M rows) once timed out with three quartile parts
#               built and nothing uploaded, because the upload ran after
#               the whole year. Only one year's chunks and one year's built
#               parquet are ever on a runner at once -- the whole point of
#               doing this per year rather than bulk-downloading ~135 slices
#               onto one 14 GB disk. max-parallel 1 also means each year
#               gets its own OIDC session, so a session covering the entire
#               multi-year run is never required.
#
#               Sessions. The role's MaxSessionDuration is Source
#               Cooperative's setting and not readable from here
#               (iam:GetRole is denied to every identity this repo holds,
#               checked 2026-09-18), so the assume step asks for six hours
#               and, if the role refuses, falls back to the default hour
#               (assume-long / assume-default below; the run log shows
#               which one took). Neither is what the per-part uploads rely
#               on: tools/upload_part.py mints a fresh one-hour session
#               from the runner's OIDC token before every upload, and the
#               final safety upload re-assumes the role right before it
#               runs. A part can only ever be uploaded on credentials
#               minutes old.
#
#   finalize    Regenerates catalog/ metadata from the PUBLISHED parts over
#               HTTP (--remote-baseline in both generators), validates it,
#               and publishes. No staged bytes: by the time this runs every
#               byte the build-year jobs produced has already been uploaded
#               and deleted from its runner.
#
# Concurrency: the group is set at the WORKFLOW level, not the job level.
# GitHub Actions allows only one PENDING job per concurrency group; a matrix
# with a job-level concurrency group would have every year after the first
# queued into that one pending slot and every year after that silently
# cancelled -- exactly the "no year silently skipped" failure this is meant
# to prevent. A workflow-level group instead serializes whole RUNS (this
# workflow, or any other that ever shares "catalog-write"), so two runs never
# write at once; within one run, `max-parallel: 1` on the build-year matrix
# and finalize's `needs: [plan, build-year]` already serialize every write
# without risking the job-level queue-of-one cancellation.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years, e.g. 2015,2016. Blank = every year with slice artifacts."
        required: false
        default: ""
      run_id:
        description: "Backfill run id to fetch slices from. Blank = the newest artifact for each slice name, across any backfill run -- safe even while a backfill is still in progress."
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      years: ${{ steps.build.outputs.years }}
    steps:
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          YEARS_IN: ${{ inputs.years }}
        run: |
          set -euo pipefail
          # gh api --jq runs the filter PER PAGE, not over the whole
          # --paginate'd result, so a filter that wraps each page in `[...]`
          # concatenates several JSON arrays into one file and json.load()
          # dies with "Extra data" as soon as there is more than one page
          # (136 artifacts, 100 per page, is already two). Emitting one
          # object per line instead -- no array brackets -- makes every
          # page's output valid JSONL on its own, and pages concatenate into
          # valid JSONL too. gh api also has no --arg; the run_id filter
          # happens in the Python below instead of in the jq expression.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false and (.name|startswith("slice-")))
                   | {name: .name, id: .id, run: .workflow_run.id}' \
            > artifacts.jsonl
          echo "found $(wc -l < artifacts.jsonl) slice artifact record(s)"

          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os

          records = []
          with open("artifacts.jsonl") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      records.append(json.loads(line))

          run_id = os.environ.get("RUN_ID", "").strip()
          if run_id:
              records = [r for r in records if str(r["run"]) == run_id]

          # The API returns artifacts newest-created-first, and --paginate
          # preserves that order across pages, so setdefault keeps the first
          # (newest) id seen for a slice name -- a slice re-fetched across
          # two backfill runs uses the latest copy, never both.
          banked: dict[str, int] = {}
          for r in records:
              banked.setdefault(r["name"], r["id"])

          by_year: dict[int, list[int]] = {}
          for name, aid in banked.items():
              # slice-YYYY-MM
              _, y, _m = name.split("-")
              by_year.setdefault(int(y), []).append(aid)

          if not by_year:
              raise SystemExit("no slice artifacts found")

          want = os.environ.get("YEARS_IN", "").strip()
          if want:
              requested = [int(y) for y in want.split(",") if y.strip()]
              missing = sorted(y for y in requested if y not in by_year)
              if missing:
                  raise SystemExit(
                      f"requested year(s) with no slice artifacts: {missing}")
              years = sorted(requested)
          else:
              years = sorted(by_year)

          include = [
              {"year": y, "ids": ",".join(str(i) for i in sorted(by_year[y]))}
              for y in years
          ]
          print("matrix=" + json.dumps({"include": include}))
          print("years=" + json.dumps(years))
          EOF

  build-year:
    needs: plan
    if: fromJson(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
      - run: pip install --quiet duckdb 'geoparquet-io==1.5.0' boto3

      - name: Download year ${{ matrix.year }}'s slice artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl staging/chunks/api
          for id in $(echo "${{ matrix.ids }}" | tr ',' ' '); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dl/$id.zip"
            unzip -q -o "dl/$id.zip" -d staging/chunks/api
            rm -f "dl/$id.zip"
          done
          echo "chunk files for ${{ matrix.year }}: $(find staging/chunks/api -name '*.parquet' | wc -l)"

      - name: Check year ${{ matrix.year }} has chunks to build
        id: chunks
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"
          NONEMPTY=$(find staging/chunks/api -maxdepth 1 -name "${Y}-*.parquet" -size +0c | wc -l)
          if [ "$NONEMPTY" -eq 0 ]; then
            echo "no non-empty chunks for $Y (Earth Search has ~none this early); nothing to build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Source Cooperative's bucket is reached by assuming a role it has
      # approved, so there is no long-lived key to leak or rotate. Every
      # matrix entry is its own runner and mints its own token here, so no
      # year's upload ever depends on a session assumed for another year.
      # Assumed BEFORE the build because the build uploads as it goes.
      # Six hours first (the job's ceiling), one retry so a role that
      # caps sessions lower says so in seconds rather than after the
      # action's twelve backed-off attempts; then the default hour. See
      # the Sessions note at the top.
      - name: Assume the Source Cooperative write role (six-hour session)
        id: assume-long
        if: steps.chunks.outputs.present == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.year }}
          aws-region: us-west-2
          role-duration-seconds: 21600
          retry-max-attempts: 1
      - name: Assume the Source Cooperative write role (default session)
        id: assume-default
        if: steps.chunks.outputs.present == 'true' && steps.assume-long.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.year }}
          aws-region: us-west-2

      # s2_fetch.py names each chunk <start>_<end>.parquet, so the year
      # prefix on the glob selects exactly this year's files -- s2_build.py
      # never has to rescan a chunk dir holding every other year too.
      #
      # Years from s2_build.ZONE_SPLIT_FROM (2019) are built as UTM-zone
      # parts (spec Amendment 3): a whole 2019 (7.17M rows) spilled past the
      # runner's disk in gpio's sort. s2_build picks the tier by year --
      # four parts for 2019-2020 (published, untouched), eight from
      # ZONE_SPLIT_8_FROM (2021), because a quartile of an 8.65M-row year
      # is ~94 min at zstd 18 and four of them do not fit the ceiling with
      # anything to spare. 2015-2018 are already published as one
      # items.parquet each and stay on the single-file path.
      #
      # --skip-existing-url: a part the bucket already has (HEAD 200) is
      # not rebuilt, so a year re-dispatched after a timeout does only the
      # parts the last run did not finish uploading. --on-part-done: each
      # part is uploaded by tools/upload_part.py as soon as it passes gpio
      # check, on a session minted for that upload; a failed upload stops
      # the year (non-zero exit), never continues silently.
      - name: Build year=${{ matrix.year }}, uploading each part as it is done
        id: build
        if: steps.chunks.outputs.present == 'true'
        env:
          PUBLIC_BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog
          S2_UPLOAD_ROLE_ARN: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          S2_UPLOAD_SESSION_NAME: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.year }}-part
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"
          SPLIT=""
          SPLIT_FROM=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from s2_build import ZONE_SPLIT_FROM; print(ZONE_SPLIT_FROM)')
          if [ "$Y" -ge "$SPLIT_FROM" ]; then
            SPLIT="--split zones"
          fi
          # $SPLIT is unquoted on purpose: empty or two words.
          python3 tools/s2_build.py --sources staging/chunks/api/${Y}-*.parquet \
            --years "$Y" --out staging/publish/sentinel-2-l2a --memory 12GB $SPLIT \
            --skip-existing-url "$PUBLIC_BASE/sentinel-2-l2a" \
            --on-part-done "python3 tools/upload_part.py --data-dir staging/publish"
          # A year whose every part was already published stages nothing
          # (s2_build skips it on the HEADs alone, exit 0). That is the
          # success the flag exists for -- a re-dispatch of a finished
          # year -- not a failure, and the safety upload below would exit
          # 1 on an empty staging tree, so it is gated on `staged`.
          if find staging/publish -name '*.parquet' | grep -q .; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::year=$Y: every part was already published; nothing built, nothing to upload"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      # Safety net, expected to upload nothing: every part was uploaded by
      # --on-part-done, and upload_data's change detection (size for a
      # multipart ETag; the listing runs on the env credentials, which
      # aws_session prefers over the config profile) sees each one already
      # there. Re-assumed first, because the session above may be hours
      # old by now. Skipped when nothing was staged.
      - name: Assume the Source Cooperative write role for the safety upload
        if: steps.build.outputs.staged == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.year }}-final
          aws-region: us-west-2
      - name: Upload anything year ${{ matrix.year }} still has staged
        if: steps.build.outputs.staged == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir staging/publish

  finalize:
    needs: [plan, build-year]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' \
            'rashid>=0.1.8,<0.2.0' stac-check

      # make_items.py/make_collection.py only consider a year "staged" (and
      # so worth --remote-baseline probing) when its year=YYYY directory
      # exists under --data-dir; they need no bytes in it. Stage EVERY
      # year from the first Sentinel-2 year to now, not just this run's
      # planned years: a chain of one-year publishes otherwise leaves the
      # committed baseline (and the live collection) describing only the
      # last run's years -- it happened twice. A year with nothing
      # published is discovered as having no parts and skipped, see
      # discover()'s ABSENT case, so over-staging costs a few HEADs.
      - name: Stage empty year markers for every year of the mission
        run: |
          set -euo pipefail
          for y in $(seq 2015 "$(date -u +%Y)"); do
            mkdir -p "staging/publish/sentinel-2-l2a/year=$y"
          done

      - name: Regenerate items and the collection from the published parts
        run: |
          python3 tools/make_items.py --data-dir staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir staging/publish/sentinel-2-l2a --remote-baseline

      - name: Validate the regenerated catalog
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      - name: Assume the Source Cooperative write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-finalize
          aws-region: us-west-2

      - name: Publish the catalog metadata
        run: python3 tools/publish.py --confirm
