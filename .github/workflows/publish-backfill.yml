name: publish-backfill

# Turn the month-slice artifacts backfill.yml produced into the published,
# year-partitioned GeoParquet index -- the first, credentialed publish of the
# whole Earth Search record.
#
# Three stages, on purpose:
#
#   plan        No cloud credentials. Lists every non-expired slice-*
#               artifact (paginated -- ~135 of them, one page is not enough),
#               groups the month ids by year, and turns that into a matrix.
#
#   build-year  One matrix job per year, max-parallel 1. Each job is its own
#               runner: it downloads only that year's slice artifacts (by
#               id, since actions/download-artifact needs a run id or it
#               only sees the CURRENT run's artifacts, and the slices were
#               uploaded by backfill.yml's run, not this one), builds that
#               year's parquet, assumes the Source Cooperative role, and
#               uploads. Only one year's chunks and one year's built parquet
#               are ever on a runner at once -- the whole point of doing
#               this per year rather than bulk-downloading ~135 slices onto
#               one 14 GB disk. max-parallel 1 also means each year gets its
#               own OIDC session, so a session covering the entire multi-year
#               run is never required (a real risk with one long-lived
#               session: STS sessions expire well under the run's length).
#
#   finalize    Regenerates catalog/ metadata from the PUBLISHED parts over
#               HTTP (--remote-baseline in both generators), validates it,
#               and publishes. No staged bytes: by the time this runs every
#               byte the build-year jobs produced has already been uploaded
#               and deleted from its runner.
#
# Concurrency: the group is set at the WORKFLOW level, not the job level.
# GitHub Actions allows only one PENDING job per concurrency group; a matrix
# with a job-level concurrency group would have every year after the first
# queued into that one pending slot and every year after that silently
# cancelled -- exactly the "no year silently skipped" failure this is meant
# to prevent. A workflow-level group instead serializes whole RUNS (this
# workflow, or any other that ever shares "catalog-write"), so two runs never
# write at once; within one run, `max-parallel: 1` on the build-year matrix
# and finalize's `needs: [plan, build-year]` already serialize every write
# without risking the job-level queue-of-one cancellation.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years, e.g. 2015,2016. Blank = every year with slice artifacts."
        required: false
        default: ""
      run_id:
        description: "Backfill run id to fetch slices from. Blank = the newest artifact for each slice name, across any backfill run -- safe even while a backfill is still in progress."
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      years: ${{ steps.build.outputs.years }}
    steps:
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          YEARS_IN: ${{ inputs.years }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq --arg run "$RUN_ID" \
              '[.artifacts[] | select(.expired==false and (.name|startswith("slice-"))
                 and ((.workflow_run.id|tostring)==$run))]' \
              > artifacts.json
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired==false and (.name|startswith("slice-")))]' \
              > artifacts.json
          fi
          echo "found $(python3 -c 'import json; print(len(json.load(open("artifacts.json"))))') slice artifact(s)"

          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os

          artifacts = json.load(open("artifacts.json"))
          # The API returns artifacts newest-created-first. setdefault keeps
          # the first (newest) id seen for a slice name, so a slice re-fetched
          # across two backfill runs uses the latest copy, never both.
          banked: dict[str, int] = {}
          for a in artifacts:
              banked.setdefault(a["name"], a["id"])

          by_year: dict[int, list[int]] = {}
          for name, aid in banked.items():
              # slice-YYYY-MM
              _, y, _m = name.split("-")
              by_year.setdefault(int(y), []).append(aid)

          want = os.environ.get("YEARS_IN", "").strip()
          if want:
              requested = [int(y) for y in want.split(",") if y.strip()]
              missing = sorted(y for y in requested if y not in by_year)
              if missing:
                  raise SystemExit(
                      f"requested year(s) with no slice artifacts: {missing}")
              years = sorted(requested)
          else:
              years = sorted(by_year)

          include = [
              {"year": y, "ids": ",".join(str(i) for i in sorted(by_year[y]))}
              for y in years
          ]
          print("matrix=" + json.dumps({"include": include}))
          print("years=" + json.dumps(years))
          EOF

  build-year:
    needs: plan
    if: fromJson(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet duckdb geoparquet-io boto3

      - name: Download year ${{ matrix.year }}'s slice artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl staging/chunks/api
          for id in $(echo "${{ matrix.ids }}" | tr ',' ' '); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dl/$id.zip"
            unzip -q -o "dl/$id.zip" -d staging/chunks/api
            rm -f "dl/$id.zip"
          done
          echo "chunk files for ${{ matrix.year }}: $(find staging/chunks/api -name '*.parquet' | wc -l)"

      # s2_fetch.py names each chunk <start>_<end>.parquet, so the year
      # prefix on the glob selects exactly this year's files -- s2_build.py
      # never has to rescan a chunk dir holding every other year too.
      - name: Build year=${{ matrix.year }}
        id: build
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"
          NONEMPTY=$(find staging/chunks/api -maxdepth 1 -name "${Y}-*.parquet" -size +0c | wc -l)
          if [ "$NONEMPTY" -eq 0 ]; then
            echo "no non-empty chunks for $Y (Earth Search has ~none this early); nothing to build"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/s2_build.py --sources staging/chunks/api/${Y}-*.parquet \
            --years "$Y" --out staging/publish/sentinel-2-l2a --memory 12GB
          echo "built=true" >> "$GITHUB_OUTPUT"

      # Source Cooperative's bucket is reached by assuming a role it has
      # approved, so there is no long-lived key to leak or rotate. Every
      # matrix entry is its own runner and mints its own token here, so no
      # year's upload ever depends on a session assumed for another year.
      - name: Assume the Source Cooperative write role
        if: steps.build.outputs.built == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ matrix.year }}
          aws-region: us-west-2

      - name: Upload year ${{ matrix.year }}
        if: steps.build.outputs.built == 'true'
        run: python3 tools/upload_data.py --confirm --data-dir staging/publish

  finalize:
    needs: [plan, build-year]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet duckdb boto3 geoparquet-io \
            'rashid>=0.1.8,<0.2.0' stac-check

      # make_items.py/make_collection.py only consider a year "staged" (and
      # so worth --remote-baseline probing) when its year=YYYY directory
      # exists under --data-dir; they need no bytes in it. A year with
      # nothing published (2015/2016 mostly) is discovered as having no
      # parts and skipped -- see discover()'s ABSENT case.
      - name: Stage empty year markers for every planned year
        env:
          YEARS: ${{ needs.plan.outputs.years }}
        run: |
          set -euo pipefail
          python3 -c '
          import json, os
          for y in json.loads(os.environ["YEARS"]):
              os.makedirs(f"staging/publish/sentinel-2-l2a/year={y}", exist_ok=True)
          '

      - name: Regenerate items and the collection from the published parts
        run: |
          python3 tools/make_items.py --data-dir staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir staging/publish/sentinel-2-l2a --remote-baseline

      - name: Validate the regenerated catalog
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      - name: Assume the Source Cooperative write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}-finalize
          aws-region: us-west-2

      - name: Publish the catalog metadata
        run: python3 tools/publish.py --confirm
