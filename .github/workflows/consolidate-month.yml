name: consolidate-month

# Fold live.parquet into the year's archive parts on the 3rd of each month
# (the lookback has long since covered month-end by then), one archive part
# per job, then empty live.
#
# The archive of a year from 2019 (s2_build.ZONE_SPLIT_FROM) is UTM-zone
# parts -- four quartiles for 2019-2020, eight octants from 2021
# (ZONE_SPLIT_8_FROM; spec Amendment 3) -- and before that one
# items.parquet. s2_build.zone_parts_for(Y) says which, and this workflow
# asks it rather than keeping its own table. Every part gets live rows
# every month, so every part is re-sorted and re-compressed at zstd 18;
# one octant of a 2021-sized year is 50-95 minutes single-threaded, and
# eight of them in one job is 8-12 hours, past the 6-hour runner ceiling.
# So the work is three jobs:
#
#   plan      The bootstrap guard, then ONE round of HEADs through
#             s2_build.consolidation_plan (published_part's retries; a
#             code that is not 200 or 404 stops the plan): is live
#             published, and which archive parts are. The answers become
#             the matrix. No live means nothing to fold: the plan says so
#             and the other jobs are skipped.
#
#   part      One job per archive part, all at once. It trusts the plan:
#             live is downloaded and any failure is fatal; a part the
#             plan saw is downloaded and any failure, a 404 included, is
#             fatal; a part the plan did not see is built from live's
#             rows alone. A job never probes for itself, so a transient
#             404 in one of eight jobs cannot pass as "never published".
#             s2_build.py --only-parts <part> drops the rows of the other
#             ranges and sorts and writes only this part, which goes to
#             finalize as a run artifact. Nothing is uploaded here.
#
#   finalize  Collects every part artifact into one staging tree and
#             stops unless the count equals the plan's part count. Then
#             it writes the zero-row live.parquet, restamps the metadata,
#             validates, and uploads: the parts first, then the emptied
#             live, then the catalog. Runs only when every part job
#             succeeded.
#
# A part job that fails stops finalize. Live stays as it is. Nothing
# uploads. The next run folds the same rows again. This matters because a
# part left out of the merge would be rewritten from live's rows alone,
# and its upload would overwrite months of scenes.
#
# Bootstrap guard: same reasoning as refresh-daily.yml -- nothing is
# published on a fresh repo until publish-backfill has run once, so the
# first step probes for catalog.json and every other job is gated on that
# succeeding. The monthly cron is a green no-op, not a red X, until then.

on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year to consolidate (blank = current)"
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

env:
  BASE: https://data.source.coop/portolan-mirrors/sentinel-2-catalog/sentinel-2-l2a

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.guard.outputs.published }}
      year: ${{ steps.plan.outputs.year }}
      live: ${{ steps.plan.outputs.live }}
      parts: ${{ steps.plan.outputs.parts }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check the catalog is published
        id: guard
        run: |
          set -uo pipefail
          if curl -fsI https://data.source.coop/portolan-mirrors/sentinel-2-catalog/catalog.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog not yet published; nothing to refresh"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.published == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.published == 'true'
        with:
          python-version: "3.12"
      - name: Install tooling
        if: steps.guard.outputs.published == 'true'
        # s2_build imports duckdb at module level; nothing else is needed
        # to ask it for the plan.
        run: pip install --quiet duckdb
      - name: Probe live and the year's archive parts
        id: plan
        if: steps.guard.outputs.published == 'true'
        run: |
          set -euo pipefail
          Y="${{ inputs.year }}"; [ -z "$Y" ] && Y=$(date -u +%Y)
          # The part names come from tools/s2_build.py (zone_parts_for picks
          # the tier by year; empty means the year is one items.parquet), so
          # the matrix cannot drift from the builder. Every HEAD is
          # published_part's: retried, and fatal on an answer that is not
          # 200 or 404.
          Y="$Y" python3 - << 'EOF'
          import json, os, sys
          sys.path.insert(0, "tools")
          from s2_build import consolidation_plan
          year = int(os.environ["Y"])
          plan = consolidation_plan(os.environ["BASE"], year)
          have = [e["part"] for e in plan["include"] if e["exists"]]
          print(f"year={year}: live {'published' if plan['live'] else 'not published'}; "
                f"archive parts {plan['parts']}, published {have}")
          if not plan["live"]:
              print(f"::notice::year={year}: no live.parquet published; nothing to fold")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"year={year}\n")
              out.write("live=" + ("true" if plan["live"] else "false") + "\n")
              out.write("parts=" + json.dumps(plan["parts"]) + "\n")
              out.write("matrix=" + json.dumps({"include": plan["include"]}) + "\n")
          EOF

  part:
    needs: plan
    if: needs.plan.outputs.published == 'true' && needs.plan.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
        run: pip install --quiet duckdb 'geoparquet-io==1.5.0'
      - name: Merge live into year=${{ needs.plan.outputs.year }}/${{ matrix.part }}.parquet
        run: |
          set -euo pipefail
          mkdir -p staging
          Y="${{ needs.plan.outputs.year }}"
          PART="${{ matrix.part }}"
          EXISTS="${{ matrix.exists }}"
          # fetch <name>: download year=$Y/<name>.parquet to staging/<name>-prev.parquet.
          # Returns 1 on a 404; any other failure -- a non-200 HEAD, or a
          # GET that fails or is cut short -- kills the job, because a part
          # silently left out of the merge is a part overwritten on upload
          # with a fraction of its rows. Whether a 404 is acceptable is the
          # plan's decision, not this job's: every caller below treats the
          # 1 as fatal too, because the plan already saw the file. fetch is
          # called as an if/|| condition, where `set -e` does not apply
          # inside the body, so every fatal path exits explicitly.
          fetch() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$BASE/year=$Y/$1.parquet")
            if [ "$code" = "404" ]; then
              echo "year=$Y/$1.parquet: not published (404)"
              return 1
            fi
            if [ "$code" != "200" ]; then
              echo "::error::year=$Y/$1.parquet: HEAD answered $code, not 200 or 404"
              exit 1
            fi
            curl -fSL -o "staging/$1-prev.parquet" "$BASE/year=$Y/$1.parquet" || {
              rm -f "staging/$1-prev.parquet"
              echo "::error::year=$Y/$1.parquet: GET failed after HEAD 200; not consolidating without it"
              exit 1
            }
          }
          fetch live || {
            echo "::error::year=$Y/live.parquet: the plan saw it published and now it is not; not consolidating"
            exit 1
          }
          SRC="staging/live-prev.parquet"
          if [ "$EXISTS" = "true" ]; then
            fetch "$PART" || {
              echo "::error::year=$Y/$PART.parquet: the plan saw it published and now it is not; not consolidating without it"
              exit 1
            }
            SRC="$SRC staging/$PART-prev.parquet"
          else
            # The first consolidation of a year: the part is live's rows alone.
            echo "year=$Y/$PART.parquet: not published (plan); building it from live alone"
          fi
          if [ "$PART" = "items" ]; then
            SHAPE="--name items.parquet"
          else
            SHAPE="--split zones --only-parts $PART"
          fi
          # $SRC and $SHAPE are unquoted on purpose: word lists.
          python3 tools/s2_build.py --sources $SRC --years "$Y" \
            --out ./staging/publish/sentinel-2-l2a --memory 12GB $SHAPE
          test -f "staging/publish/sentinel-2-l2a/year=$Y/$PART.parquet"
      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-${{ needs.plan.outputs.year }}-${{ matrix.part }}
          path: staging/publish/sentinel-2-l2a/year=${{ needs.plan.outputs.year }}/${{ matrix.part }}.parquet
          retention-days: 3
          if-no-files-found: error
          # zstd-18 parquet does not compress again; gzip would cost
          # minutes per part for nothing.
          compression-level: 0

  finalize:
    needs: [plan, part]
    # always() so a skipped part matrix does not skip this job's own
    # evaluation; the result check is what keeps a failed part from
    # publishing anything.
    if: always() && needs.plan.outputs.published == 'true' && needs.plan.outputs.live == 'true' && needs.part.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      Y: ${{ needs.plan.outputs.year }}
      PARTS: ${{ needs.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        # geoparquet-io pinned on purpose: see ci.yml and gpio-fix-report.md.
        run: pip install --quiet duckdb boto3 'geoparquet-io==1.5.0' 'rashid>=0.1.8,<0.2.0' stac-check
      - name: Collect the consolidated parts
        uses: actions/download-artifact@v4
        with:
          pattern: consolidated-${{ needs.plan.outputs.year }}-*
          merge-multiple: true
          path: staging/publish/sentinel-2-l2a/year=${{ needs.plan.outputs.year }}/
      - name: Check every planned part arrived, then write the emptied live.parquet
        run: |
          set -euo pipefail
          YEAR_DIR="staging/publish/sentinel-2-l2a/year=$Y"
          mkdir -p "$YEAR_DIR"
          echo "consolidated parts:"
          find "$YEAR_DIR" -maxdepth 1 -name '*.parquet' ! -name 'live.parquet' | sort
          # Every part in the plan must be here. A short set uploaded with an
          # emptied live would leave a hole in the year, so a mismatch stops
          # the job before anything is written or uploaded.
          python3 - << 'EOF'
          import json, os
          from pathlib import Path
          y = os.environ["Y"]
          planned = json.loads(os.environ["PARTS"])
          year_dir = Path(f"staging/publish/sentinel-2-l2a/year={y}")
          have = sorted(p.stem for p in year_dir.glob("*.parquet") if p.name != "live.parquet")
          if have != sorted(planned):
              raise SystemExit(
                  f"year={y}: planned parts {sorted(planned)} but the part jobs "
                  f"delivered {have}; not uploading a year that is short")
          print(f"year={y}: all {len(planned)} planned part(s) delivered")
          EOF
          # Empty live: publish a zero-row live.parquet rather than deleting
          # (publishing never deletes; a missing object would 404 in the glob
          # clients already resolved). Its schema is copied from whichever
          # archive part the merge just wrote.
          python3 - << 'EOF'
          import duckdb, glob, os
          y = os.environ["Y"]
          con = duckdb.connect(); con.execute("INSTALL spatial; LOAD spatial;")
          year_dir = f"staging/publish/sentinel-2-l2a/year={y}"
          parts = sorted(p for p in glob.glob(f"{year_dir}/*.parquet")
                         if not p.endswith("/live.parquet"))
          if not parts:
              raise SystemExit(f"no archive part written under {year_dir}")
          dst = f"{year_dir}/live.parquet"
          con.execute(f"COPY (SELECT * FROM read_parquet('{parts[0]}') LIMIT 0) TO '{dst}' (FORMAT PARQUET, COMPRESSION zstd)")
          EOF
      - name: Restamp collection metadata
        run: |
          python3 tools/make_items.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
          python3 tools/make_collection.py --data-dir ./staging/publish/sentinel-2-l2a --remote-baseline
      - name: Validate before upload
        run: python3 tests/run_all.py
        env:
          CI_LIGHT: "1"
      - name: Assume the Source Cooperative write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2
      # Upload order matters. The archive parts must land before the emptied
      # live.parquet. A client that reads the year's glob while the parts
      # are up and the old live is still there sees this month's scenes
      # twice. That is harmless. A client that saw the empty live before
      # the parts landed would see a hole where this month's scenes were.
      # That is not. upload_data.py without --only walks the whole tree on
      # a thread pool (publish.upload_all), and its sorted walk puts
      # live.parquet before z*.parquet in any case, so the natural order
      # guarantees nothing. Two passes: every archive part through --only,
      # then live on its own once all of them are up.
      - name: Upload the archive parts
        run: |
          set -euo pipefail
          for f in $(find "staging/publish/sentinel-2-l2a/year=$Y" -maxdepth 1 -name '*.parquet' ! -name 'live.parquet' | sort); do
            python3 tools/upload_data.py --confirm --data-dir ./staging/publish \
              --only "sentinel-2-l2a/year=$Y/$(basename "$f")"
          done
      - name: Upload the emptied live.parquet
        run: |
          set -euo pipefail
          python3 tools/upload_data.py --confirm --data-dir ./staging/publish \
            --only "sentinel-2-l2a/year=$Y/live.parquet"
      - name: Publish catalog metadata
        run: python3 tools/publish.py --confirm
